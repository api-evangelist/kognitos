openapi: 3.2.0
info:
  title: Kognitos Automations API
  version: 1.0.0
  contact:
    name: Kognitos
    url: https://kognitos.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Automations across 2 of this provider''s published API definitions: kognitos-openapi.yaml, kognitos-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.us-1.kognitos.com
security:
- BearerAuth: []
tags:
- name: Automations
  description: Create and configure automations, revisions, schedules, triggers, and connections.
paths:
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:
    get:
      summary: Get Automation
      operationId: GetAutomation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Automation'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:query:
    get:
      summary: Query Automation
      description: 'This custom method allows explicit selection of which version stage to retrieve:

        - AUTOMATION_STAGE_DRAFT: Returns the latest draft version

        - AUTOMATION_STAGE_PUBLISHED: Returns the latest published version'
      operationId: QueryAutomation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Automation'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: stage
        description: "The publication stage of the automation to retrieve.\nDetermines which version of the automation to return:\n- AUTOMATION_STAGE_DRAFT: Returns the latest draft version\n- AUTOMATION_STAGE_PUBLISHED: Returns the latest published version\n\n - AUTOMATION_STAGE_UNSPECIFIED: Automation stage is not specified.\n - AUTOMATION_STAGE_DRAFT: Automation is in draft stage and can be modified.\n - AUTOMATION_STAGE_PUBLISHED: Automation is published and immutable, ready for execution."
        in: query
        required: true
        schema:
          type: string
          enum:
          - AUTOMATION_STAGE_UNSPECIFIED
          - AUTOMATION_STAGE_DRAFT
          - AUTOMATION_STAGE_PUBLISHED
          default: AUTOMATION_STAGE_UNSPECIFIED
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/revisions/{revision_id}:
    get:
      summary: Get Automation Revision
      operationId: GetAutomationRevision
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AutomationRevision'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/revisions:
    get:
      summary: List Automation Revisions
      operationId: ListAutomationRevisions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAutomationRevisionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: 'The maximum number of revisions to return in a single response.

          The service may return fewer than this value.

          If unspecified, at most 50 revisions will be returned.

          The maximum value is 1000; values above 1000 will be coerced to 1000.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'A page token received from a previous `ListAutomationRevisions` call.

          Provide this to retrieve the subsequent page of results.'
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: "Filter expression to restrict results. Per AIP-160, this should be a\nfiltering expression following the Common Expression Language (CEL) syntax.\n\nSupported fields for filtering:\n  - `stage`: The automation revision stage (e.g., DRAFT, PUBLISHED)\n\nExample filters:\n  - `stage = \"DRAFT\"` - Returns only draft revisions\n  - `stage = \"PUBLISHED\"` - Returns only published revisions\n\nIf not specified or passed null, all revisions will be returned for that automation."
        in: query
        required: false
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations:
    get:
      summary: List Automations
      operationId: ListAutomations
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListAutomationsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: 'The maximum number of automations to return in a single response.

          The service may return fewer than this value.

          If unspecified, at most 10 automations will be returned.

          The maximum value is 1000; values above 1000 will be coerced to 1000.

          If negative, an INVALID_ARGUMENT error will be returned.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'A page token received from a previous `ListAutomations` call.

          Provide this to retrieve the subsequent page of results.

          When paginating, all other parameters provided to `ListAutomations` must match

          the call that provided the page token.'
        in: query
        required: false
        schema:
          type: string
      - name: show_deleted
        description: Filter to show/hide deleted automations. Deleted automations will be hidden by default.
        in: query
        required: false
        schema:
          type: boolean
      - name: filter
        description: "Filter expression to restrict results. Per AIP-160, this should be a\nfiltering expression following the Common Expression Language (CEL) syntax.\n\nSupported fields for filtering:\n  - `state`: The automation state (e.g., DRAFT, PUBLISHED)\n\nExample filters:\n  - `state = \"PUBLISHED\"`"
        in: query
        required: false
        schema:
          type: string
      - name: order_by
        description: 'Reserved for future use. Comma-separated list of fields to order results by.

          Per AIP-132, this should be a string containing one or more field names,

          each optionally followed by "asc" or "desc" to specify sort direction.


          Currently not implemented. Results are always ordered by `update_time desc`

          (most recently updated first).'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:invoke:
    post:
      summary: Invoke Automation
      operationId: InvokeAutomation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1InvokeAutomationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeAutomationBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:listDefaultInputsHistory:
    get:
      summary: List Default Inputs History
      description: 'Results are returned in reverse chronological order (newest first).

        Optionally filter by stage (DRAFT or PUBLISHED).'
      operationId: ListDefaultInputsHistory
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListDefaultInputsHistoryResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: Maximum number of entries to return. Defaults to 50 if not specified.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: Page token for pagination, from a previous ListDefaultInputsHistoryResponse.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations:countConnectionUsage:
    post:
      summary: Count Connection Usage
      operationId: CountConnectionUsage
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1CountConnectionUsageResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountConnectionUsageBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations:traceConnectionUsage:
    post:
      summary: Trace Connection Usage
      operationId: TraceConnectionUsage
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1TraceConnectionUsageResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceConnectionUsageBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:extractCodeConnections:
    get:
      summary: Extract Automation Code Connections
      operationId: ExtractAutomationCodeConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ExtractAutomationCodeConnectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: filter
        description: "Filter expression to restrict results. Per AIP-160, this should be a\nfiltering expression following the Common Expression Language (CEL) syntax.\n\nSupported fields for filtering:\n  - `stage`: The automation stage to extract connections from (e.g., DRAFT, PUBLISHED)\n\nExample filters:\n  - `stage = \"DRAFT\"`\n  - `stage = \"PUBLISHED\"`"
        in: query
        required: true
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:upgradeConnections:
    post:
      summary: Upgrade Automation Connections
      description: 'Multiple connections can be upgraded in a single atomic operation. All upgrades succeed

        together or all fail together. The automation version is incremented once for all upgrades.


        This operation only works on draft automations. To upgrade connections in a published

        automation, first use ForkPublishedAutomation to create a draft, then call this method.


        Per AIP-136, this is a custom method using the :upgradeConnections suffix.'
      operationId: UpgradeAutomationConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1UpgradeAutomationConnectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeAutomationConnectionsBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:switchConnections:
    post:
      summary: Switch Automation Connections
      description: 'Multiple connections can be switched in a single atomic operation. All switches succeed

        together or all fail together. The automation version is incremented once for all switches.


        This operation only works on draft automations. To switch connections in a published

        automation, first use ForkPublishedAutomation to create a draft, then call this method.


        Per AIP-136, this is a custom method using the :switchConnections suffix.'
      operationId: SwitchAutomationConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1SwitchAutomationConnectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchAutomationConnectionsBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:removeConnections:
    post:
      summary: Remove Automation Connections
      description: 'Multiple connections can be removed in a single atomic operation. All removals succeed

        together or all fail together. The automation version is incremented once for all removals.


        This operation only works on draft automations. To remove connections in a published

        automation, first use ForkPublishedAutomation to create a draft, then call this method.


        Per AIP-136, this is a custom method using the :removeConnections suffix.'
      operationId: RemoveAutomationConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1RemoveAutomationConnectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveAutomationConnectionsBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}:addConnections:
    post:
      summary: Add Automation Connections
      description: 'Multiple connections can be added in a single atomic operation. All additions succeed

        together or all fail together. The automation version is incremented once for all additions.


        This operation only works on draft automations. To add connections to a published

        automation, first use ForkPublishedAutomation to create a draft, then call this method.


        Per AIP-136, this is a custom method using the :addConnections suffix.'
      operationId: AddAutomationConnections
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AddAutomationConnectionsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAutomationConnectionsBody'
        required: true
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/visualization:
    get:
      summary: Get Automation Visualization
      operationId: GetAutomationVisualization
      responses:
