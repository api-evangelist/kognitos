        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Automations
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/schedule:
    post:
      summary: Create Automation Schedule
      operationId: CreateAutomationSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AutomationSchedule'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v1AutomationSchedule'
        description: The schedule to create.
        required: true
      tags:
      - Automations
    patch:
      summary: Update Automation Schedule
      operationId: UpdateAutomationSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AutomationSchedule'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  $ref: '#/components/schemas/v1ScheduleConfig'
                enabled:
                  type: boolean
                  description: 'Whether the schedule is currently enabled.

                    Disabled schedules do not trigger automation invocations.'
                  readOnly: true
                summary:
                  type: string
                  title: 'Human-readable summary of the schedule for display in the UI.

                    Generated by the backend based on the schedule configuration.

                    Examples: "Every weekday at 9:00 AM PT", "Monthly on the 4th Friday at 2:30 PM"'
                  readOnly: true
                next_run_times:
                  type: array
                  items:
                    type: string
                    format: date-time
                  description: 'List of the next scheduled execution times.

                    Useful for preview and verification. Backend generates these.'
                  readOnly: true
                remaining_occurrences:
                  type: integer
                  format: int32
                  description: 'Number of remaining occurrences if the schedule has an end condition.

                    Only populated when config.end.end_type is SCHEDULE_END_TYPE_AFTER_OCCURRENCES.'
                  readOnly: true
              title: The schedule to update.
              required:
              - config
        description: The schedule to update.
        required: true
      tags:
      - Automations
    get:
      summary: Get Automation Schedule
      operationId: GetAutomationSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1AutomationSchedule'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Automations
    delete:
      summary: Delete Automation Schedule
      operationId: DeleteAutomationSchedule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
