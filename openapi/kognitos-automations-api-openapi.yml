components:
  schemas:
    v1AutomationRevision:
      type: object
      properties:
        name:
          type: string
          description: 'The name of the automation revision.

            Format: organizations/{organization}/workspaces/{workspace}/automations/{automation}/revisions/{revision}

            The revision ID is the semantic version string (e.g., "0.1", "1.0", "2.0").'
        snapshot:
          $ref: '#/components/schemas/v1Automation'
        create_time:
          type: string
          format: date-time
          description: Timestamp when this revision was created.
          readOnly: true
        alternate_ids:
          type: array
          items:
            type: string
          description: 'Other revision IDs that reference the same snapshot (e.g., "latest").

            Per AIP-162, this allows aliases for revisions.'
          readOnly: true
      description: 'AutomationRevision represents a historical revision (version) of an automation.

        Revisions are immutable snapshots created each time an automation is updated.

        Per AIP-162, this resource contains the complete state via a snapshot field.'
    v1AutomationStage:
      type: string
      enum:
      - AUTOMATION_STAGE_UNSPECIFIED
      - AUTOMATION_STAGE_DRAFT
      - AUTOMATION_STAGE_PUBLISHED
      default: AUTOMATION_STAGE_UNSPECIFIED
      description: "AutomationStage represents the publication stage of an automation.\nThis enum is shared across services that manage or execute automations.\n\n - AUTOMATION_STAGE_UNSPECIFIED: Automation stage is not specified.\n - AUTOMATION_STAGE_DRAFT: Automation is in draft stage and can be modified.\n - AUTOMATION_STAGE_PUBLISHED: Automation is published and immutable, ready for execution."
    v1ListAutomationTriggersResponse:
      type: object
      properties:
        automation_triggers:
          type: array
          items:
            $ref: '#/components/schemas/v1AutomationTrigger'
          description: List of triggers that are active for the specified automation.
        next_page_token:
          type: string
          description: 'A token that can be sent as `page_token` to retrieve the next page.

            If this field is omitted, there are no subsequent pages.'
      description: Response containing the list of active triggers for an automation.
    AddAutomationConnectionsBody:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/v1CredentialInfo'
          description: 'List of connections to add. All additions are performed atomically:

            either all succeed or all fail. The automation version is incremented once

            for all additions.


            Each connection must be unique within the list. If duplicate connections appear,

            the request will fail with INVALID_ARGUMENT.'
      description: AddAutomationConnectionsRequest specifies which connections to add to a draft automation.
      required:
      - connections
    RemoveAutomationConnectionsBody:
      type: object
      properties:
        removals:
          type: array
          items:
            $ref: '#/components/schemas/v1ConnectionRemoval'
          description: 'List of connections to remove. All removals are performed atomically:

            either all succeed or all fail. The automation version is incremented once

            for all removals.


            Each connection (identified by connection_id and connection_alias) must be unique

            within the list. If the same connection appears multiple times, the request will

            fail with INVALID_ARGUMENT.


            For each connection, the corresponding entry in automation.connections will be removed

            and code references will be replaced with placeholders (kognitos.connection_name.{book}).'
      description: RemoveAutomationConnectionsRequest specifies which connections to remove from a draft automation.
      required:
      - removals
    v1OrdinalDayOfWeek:
      type: object
      properties:
        ordinal:
          $ref: '#/components/schemas/v1Ordinal'
        day:
          $ref: '#/components/schemas/v1DayOfWeek'
      description: 'OrdinalDayOfWeek represents a pattern like "first Monday" or "last Friday".

        Used as a building block for monthly and yearly patterns.'
      required:
      - ordinal
      - day
    v1VisualizationState:
      type: string
      enum:
      - VISUALIZATION_STATE_UNSPECIFIED
      - VISUALIZATION_STATE_PENDING
      - VISUALIZATION_STATE_COMPLETED
      - VISUALIZATION_STATE_FAILED
      default: VISUALIZATION_STATE_UNSPECIFIED
      description: "VisualizationState indicates the current state of visualization generation.\n\n - VISUALIZATION_STATE_UNSPECIFIED: Unspecified state.\n - VISUALIZATION_STATE_PENDING: Visualization generation is in progress.\n - VISUALIZATION_STATE_COMPLETED: Visualization generation completed successfully.\n - VISUALIZATION_STATE_FAILED: Visualization generation failed."
    v1ConnectionRemoval:
      type: object
      properties:
        connection_id:
          type: string
          description: 'The connection ID to remove.

            This connection ID must exist in the automation.'
        connection_alias:
          type: string
          description: 'The alias of the connection to remove.

            This alias must match the connection being removed.'
      description: ConnectionRemoval specifies a connection to remove from an automation.
      required:
      - connection_id
      - connection_alias
    v1Month:
      type: string
      enum:
      - MONTH_UNSPECIFIED
      - MONTH_JANUARY
      - MONTH_FEBRUARY
      - MONTH_MARCH
      - MONTH_APRIL
      - MONTH_MAY
      - MONTH_JUNE
      - MONTH_JULY
      - MONTH_AUGUST
      - MONTH_SEPTEMBER
      - MONTH_OCTOBER
      - MONTH_NOVEMBER
      - MONTH_DECEMBER
      default: MONTH_UNSPECIFIED
      description: "Month represents months of the year.\n\n - MONTH_UNSPECIFIED: Unspecified month.\n - MONTH_JANUARY: January.\n - MONTH_FEBRUARY: February.\n - MONTH_MARCH: March.\n - MONTH_APRIL: April.\n - MONTH_MAY: May.\n - MONTH_JUNE: June.\n - MONTH_JULY: July.\n - MONTH_AUGUST: August.\n - MONTH_SEPTEMBER: September.\n - MONTH_OCTOBER: October.\n - MONTH_NOVEMBER: November.\n - MONTH_DECEMBER: December."
    v1ScheduleEndType:
      type: string
      enum:
      - SCHEDULE_END_TYPE_UNSPECIFIED
      - SCHEDULE_END_TYPE_NEVER
      - SCHEDULE_END_TYPE_ON_DATE
      - SCHEDULE_END_TYPE_AFTER_OCCURRENCES
      default: SCHEDULE_END_TYPE_UNSPECIFIED
      description: "ScheduleEndType defines how a schedule terminates.\n\n - SCHEDULE_END_TYPE_UNSPECIFIED: Unspecified end type. Defaults to NEVER.\n - SCHEDULE_END_TYPE_NEVER: Schedule runs indefinitely (never ends).\n - SCHEDULE_END_TYPE_ON_DATE: Schedule ends on a specific date.\n - SCHEDULE_END_TYPE_AFTER_OCCURRENCES: Schedule ends after a specific number of occurrences."
    v1DefaultInputsHistoryEntry:
      type: object
      properties:
        default_inputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: The default inputs snapshot at the time of this change.
          readOnly: true
        change_time:
          type: string
          format: date-time
          description: When this change was made.
          readOnly: true
        change_actor:
          type: string
          description: User ID of the person who made this change.
          readOnly: true
      description: DefaultInputsHistoryEntry represents a single default input change event.
    v1Table:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/v1Column'
      description: 'A table is a column-oriented structure. All the values inside each column must

        be of equal length.'
    v1BookConnection:
      type: object
      properties:
        connection_id:
          type: string
          description: Unique identifier for this connection resource.
        endpoint:
          type: string
          description: Endpoint for the connection.
      description: 'BookConnection is a resource representing a connection to a book instance.

        A connection has a unique identifier and an endpoint.'
    v1CountConnectionUsageResponse:
      type: object
      properties:
        connection_counts:
          type: array
          items:
            $ref: '#/components/schemas/v1ConnectionAutomationCount'
          description: 'List of connection IDs with their corresponding automation counts.

            The order matches the order of connection_ids in the request.'
      description: CountConnectionUsageResponse returns automation counts for each requested connection ID.
    v1List:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/commonV1Value'
          title: The ordered sequence of values in this list
      description: "Represents an ordered collection of values (similar to arrays or lists).\n\nThis message can contain any number of Value elements in a specific order.\nLists are mutable and can grow or shrink during runtime. Elements can be\naccessed by their zero-based index position.\n\nExamples:\n - [1, 2, 3] - list of numbers\n - [\"hello\", \"world\"] - list of strings\n - [true, 42, \"mixed\"] - list with mixed types\n - [[1, 2], [3, 4]] - nested lists"
    v1AutomationVisualization:
      type: object
      properties:
        name:
          type: string
          title: 'The resource name of the visualization.

            Format: organizations/{org}/workspaces/{ws}/automations/{automation}/visualization'
        graph:
          $ref: '#/components/schemas/v1FlowGraph'
        automation_version:
          type: string
          description: 'The semantic version of the automation this visualization represents.

            Format: "major.0" (e.g., "1.0", "2.0", "3.0") - always a published version.

            This corresponds to the automation''s published version at the time of generation.'
          readOnly: true
        state:
          $ref: '#/components/schemas/v1VisualizationState'
        error_message:
          type: string
          description: 'Error message describing why generation failed.

            Only populated when state is VISUALIZATION_STATE_FAILED.'
          readOnly: true
      description: 'AutomationVisualization represents a visual representation of an automation''s execution flow.

        Visualizations are generated for published automation versions and stored as configurations

        for rendering in the UI. This is a singleton resource - each automation has exactly one visualization

        representing its latest published version.'
    v1ScheduleEnd:
      type: object
      properties:
        end_type:
          $ref: '#/components/schemas/v1ScheduleEndType'
        end_date:
          $ref: '#/components/schemas/typeDate'
        max_occurrences:
          type: integer
          format: int32
          description: 'Number of occurrences when end_type is SCHEDULE_END_TYPE_AFTER_OCCURRENCES.

            Schedule stops after this many executions.'
      description: ScheduleEnd defines when the schedule stops running.
      required:
      - end_type
    bdkV1ListValue:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/bdkV1Value'
          title: All the values inside the list
      title: A collection of values
    v1RepeatInterval:
      type: object
      properties:
        unit:
          $ref: '#/components/schemas/v1FrequencyUnit'
        interval:
          type: integer
          format: int32
          description: 'The interval value. For example, 2 with FREQUENCY_UNIT_WEEK means "every 2 weeks".

            Must be a positive integer. Defaults to 1 if not specified.'
      description: RepeatInterval defines how often the schedule repeats.
      required:
      - unit
    v1AutomationSchedule:
      type: object
      properties:
        name:
          type: string
          title: 'Resource name of the schedule.

            Format: organizations/{org}/workspaces/{ws}/automations/{automation}/schedule'
        config:
          $ref: '#/components/schemas/v1ScheduleConfig'
        enabled:
          type: boolean
          description: 'Whether the schedule is currently enabled.

            Disabled schedules do not trigger automation invocations.'
          readOnly: true
        summary:
          type: string
          title: 'Human-readable summary of the schedule for display in the UI.

            Generated by the backend based on the schedule configuration.

            Examples: "Every weekday at 9:00 AM PT", "Monthly on the 4th Friday at 2:30 PM"'
          readOnly: true
        next_run_times:
          type: array
          items:
            type: string
            format: date-time
          description: 'List of the next scheduled execution times.

            Useful for preview and verification. Backend generates these.'
          readOnly: true
        remaining_occurrences:
          type: integer
          format: int32
          description: 'Number of remaining occurrences if the schedule has an end condition.

            Only populated when config.end.end_type is SCHEDULE_END_TYPE_AFTER_OCCURRENCES.'
          readOnly: true
      description: 'AutomationSchedule represents a schedule for invoking an automation.

        Each automation can have at most one schedule. Kestra is the source of truth.'
      required:
      - config
    v1TraceConnectionUsageResponse:
      type: object
      properties:
        automations:
          type: array
          items:
            $ref: '#/components/schemas/v1AutomationConnectionUsage'
          description: List of automations that use the specified connection, with their stages.
      description: TraceConnectionUsageResponse returns automations that use the specified connection.
    v1FlowNode:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this node within the graph.
        label:
          type: string
          description: Human-readable label describing this step.
        type:
          $ref: '#/components/schemas/v1FlowNodeType'
      description: FlowNode represents a single step or decision point in the automation flow.
    v1UpgradeAutomationConnectionsResponse:
      type: object
      properties:
        automation:
          $ref: '#/components/schemas/v1Automation'
      description: UpgradeAutomationConnectionsResponse returns the updated automation.
    v1DayOfWeek:
      type: string
      enum:
      - DAY_OF_WEEK_UNSPECIFIED
      - DAY_OF_WEEK_MONDAY
      - DAY_OF_WEEK_TUESDAY
      - DAY_OF_WEEK_WEDNESDAY
      - DAY_OF_WEEK_THURSDAY
      - DAY_OF_WEEK_FRIDAY
      - DAY_OF_WEEK_SATURDAY
      - DAY_OF_WEEK_SUNDAY
      default: DAY_OF_WEEK_UNSPECIFIED
      description: "DayOfWeek represents days of the week for scheduling.\nValues align with ISO 8601 (Monday = 1, Sunday = 7).\n\n - DAY_OF_WEEK_UNSPECIFIED: Unspecified day.\n - DAY_OF_WEEK_MONDAY: Monday.\n - DAY_OF_WEEK_TUESDAY: Tuesday.\n - DAY_OF_WEEK_WEDNESDAY: Wednesday.\n - DAY_OF_WEEK_THURSDAY: Thursday.\n - DAY_OF_WEEK_FRIDAY: Friday.\n - DAY_OF_WEEK_SATURDAY: Saturday.\n - DAY_OF_WEEK_SUNDAY: Sunday."
    v1DisableAutomationScheduleResponse:
      type: object
      properties:
        schedule:
          $ref: '#/components/schemas/v1AutomationSchedule'
      description: DisableAutomationScheduleResponse contains the disabled schedule.
    v1ValueType:
      type: object
      properties:
        scalar_type:
          $ref: '#/components/schemas/v1ValueScalarType'
        optional_type:
          $ref: '#/components/schemas/v1ValueOptionalType'
        list_type:
          $ref: '#/components/schemas/v1ValueListType'
        dictionary_type:
          $ref: '#/components/schemas/v1ValueDictionaryType'
        table_type:
          $ref: '#/components/schemas/v1ValueTableType'
        opaque_type:
          $ref: '#/components/schemas/v1ValueOpaqueType'
        any_type:
          $ref: '#/components/schemas/v1ValueAnyType'
        union_type:
          $ref: '#/components/schemas/v1ValueUnionType'
        sensitive_type:
          $ref: '#/components/schemas/v1ValueSensitiveType'
        enum_type:
          $ref: '#/components/schemas/v1ValueEnumType'
        generic_dictionary_type:
          $ref: '#/components/schemas/v1ValueGenericDictionaryType'
      title: Represents a complete value type definition using a discriminated union
    SwitchAutomationConnectionsBody:
      type: object
      properties:
        switches:
          type: array
          items:
            $ref: '#/components/schemas/v1ConnectionReplacement'
          description: 'List of connections to switch. All switches are performed atomically:

            either all succeed or all fail. The automation version is incremented once

            for all switches.


            Each old_connection_id must be unique within the list. If the same old_connection_id

            appears multiple times, the request will fail with INVALID_ARGUMENT.'
      description: SwitchAutomationConnectionsRequest specifies which connections to switch in a draft automation.
      required:
      - switches
    typeDateTime:
      type: object
      properties:
        year:
          type: integer
          format: int32
          description: 'Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a

            datetime without a year.'
        month:
          type: integer
          format: int32
          description: Required. Month of year. Must be from 1 to 12.
        day:
          type: integer
          format: int32
          description: 'Required. Day of month. Must be from 1 to 31 and valid for the year and

            month.'
        hours:
          type: integer
          format: int32
          description: 'Required. Hours of day in 24 hour format. Should be from 0 to 23. An API

            may choose to allow the value "24:00:00" for scenarios like business

            closing time.'
        minutes:
          type: integer
          format: int32
          description: Required. Minutes of hour of day. Must be from 0 to 59.
        seconds:
          type: integer
          format: int32
          description: 'Required. Seconds of minutes of the time. Must normally be from 0 to 59. An

            API may allow the value 60 if it allows leap-seconds.'
        nanos:
          type: integer
          format: int32
          description: 'Required. Fractions of seconds in nanoseconds. Must be from 0 to

            999,999,999.'
        utc_offset:
          type: string
          description: 'UTC offset. Must be whole seconds, between -18 hours and +18 hours.

            For example, a UTC offset of -4:00 would be represented as

            { seconds: -14400 }.'
        time_zone:
          $ref: '#/components/schemas/typeTimeZone'
      description: "Represents civil time (or occasionally physical time).\n\nThis type can represent a civil time in one of a few possible ways:\n\n * When utc_offset is set and time_zone is unset: a civil time on a calendar\n   day with a particular offset from UTC.\n * When time_zone is set and utc_offset is unset: a civil time on a calendar\n   day in a particular time zone.\n * When neither time_zone nor utc_offset is set: a civil time on a calendar\n   day in local time.\n\nThe date is relative to the Proleptic Gregorian Calendar.\n\nIf year is 0, the DateTime is considered not to have a specific year. month\nand day must have valid, non-zero values.\n\nThis type may also be used to represent a physical time if all the date and\ntime fields are set and either case of the `time_offset` oneof is set.\nConsider using `Timestamp` message for physical time instead. If your use\ncase also would like to store the user's timezone, that can be done in\nanother field.\n\nThis type is more flexible than some applications may want. Make sure to\ndocument and validate your application's limitations."
    v1ExtractAutomationCodeConnectionsResponse:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/v1CredentialInfo'
          description: 'List of connections found in the automation''s SPy code.

            Includes both placeholder connections (without connection_id) and concrete connections (with connection_id).'
          readOnly: true
      description: ExtractAutomationCodeConnectionsResponse returns connection information from the automation's SPy code.
    typeTimeOfDay:
      type: object
      properties:
        hours:
          type: integer
          format: int32
          description: 'Hours of day in 24 hour format. Should be from 0 to 23. An API may choose

            to allow the value "24:00:00" for scenarios like business closing time.'
        minutes:
          type: integer
          format: int32
          description: Minutes of hour of day. Must be from 0 to 59.
        seconds:
          type: integer
          format: int32
          description: 'Seconds of minutes of the time. Must normally be from 0 to 59. An API may

            allow the value 60 if it allows leap-seconds.'
        nanos:
          type: integer
          format: int32
          description: Fractions of seconds in nanoseconds. Must be from 0 to 999,999,999.
      description: 'Represents a time of day. The date and time zone are either not significant

        or are specified elsewhere. An API may choose to allow leap seconds. Related

        types are [google.type.Date][google.type.Date] and

        `google.protobuf.Timestamp`.'
    v1ValueDictionaryType:
      type: object
      properties:
        is_a:
          type: string
          title: Semantic classification of what this dictionary represents
        fields:
          type: array
          items:
