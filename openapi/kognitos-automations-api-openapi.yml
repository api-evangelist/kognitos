            This is the automation ID portion only (e.g., the {automation} part of the resource name).'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/v1AutomationStage'
          description: 'The stages in which this automation uses the connection.

            Can include AUTOMATION_STAGE_DRAFT, AUTOMATION_STAGE_PUBLISHED, or both.'
      description: 'AutomationConnectionUsage represents an automation that uses a specific connection,

        along with the stages (DRAFT, PUBLISHED, or both) where the connection is used.'
    v1FrequencyUnit:
      type: string
      enum:
      - FREQUENCY_UNIT_UNSPECIFIED
      - FREQUENCY_UNIT_MINUTE
      - FREQUENCY_UNIT_HOUR
      - FREQUENCY_UNIT_DAY
      - FREQUENCY_UNIT_WEEK
      - FREQUENCY_UNIT_MONTH
      - FREQUENCY_UNIT_YEAR
      default: FREQUENCY_UNIT_UNSPECIFIED
      description: "FrequencyUnit defines the unit for schedule repetition.\n\n - FREQUENCY_UNIT_UNSPECIFIED: Unspecified frequency unit.\n - FREQUENCY_UNIT_MINUTE: Schedule repeats every N minutes.\n - FREQUENCY_UNIT_HOUR: Schedule repeats every N hours.\n - FREQUENCY_UNIT_DAY: Schedule repeats every N days.\n - FREQUENCY_UNIT_WEEK: Schedule repeats every N weeks.\n - FREQUENCY_UNIT_MONTH: Schedule repeats every N months.\n - FREQUENCY_UNIT_YEAR: Schedule repeats every N years."
    v1ListDefaultInputsHistoryResponse:
      type: object
      properties:
        default_inputs_history_entries:
          type: array
          items:
            $ref: '#/components/schemas/v1DefaultInputsHistoryEntry'
          description: The history entries, ordered newest first.
        next_page_token:
          type: string
          description: Token for retrieving the next page. Empty if no more results.
      description: ListDefaultInputsHistoryResponse contains a paginated list of default input history entries.
    v1Dictionary:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/v1DictionaryEntry'
          title: The key-value pairs stored in this dictionary
      description: "Represents a key-value mapping (similar to hash maps or dictionaries).\n\nThis message stores associations between keys and values, where keys must be\nhashable types (null, bool, Number, string, Date, TimeOfDay, DateTime, TimeZone). Keys are\nunique within a dictionary - duplicate keys will overwrite previous values.\n\nThe dictionary maintains insertion order for consistent iteration behavior.\n\nExamples:\n - {\"name\": \"John\", \"age\": 30} - string keys with mixed values\n - {1: \"one\", 2: \"two\"} - number keys with string values\n - {\"nested\": {\"inner\": \"value\"}} - nested dictionaries"
    v1AffectedAutomation:
      type: object
      properties:
        automation_id:
          type: string
          description: The automation ID (the {automation} segment of the resource name).
          readOnly: true
        display_name:
          type: string
          description: The human-readable display name of the automation.
          readOnly: true
      description: AffectedAutomation describes a draft automation affected by connection deletion.
    v1Number:
      type: object
      properties:
        lo:
          type: integer
          format: int64
          description: Low 32 bits of the 96-bit mantissa.
        mid:
          type: integer
          format: int64
          description: Middle 32 bits of the 96-bit mantissa.
        hi:
          type: integer
          format: int64
          description: High 32 bits of the 96-bit mantissa.
        flags:
          type: integer
          format: int64
          description: "Flags word:\n - Bits 16–23: scale (0–28)\n - Bit 31: sign (0 = positive, 1 = negative)\n - Other bits must be zero."
      description: "A fixed-precision decimal number with up to 28 fractional digits.\n\nThis message represents decimal numbers with exact precision, avoiding\nfloating-point rounding errors. It's particularly useful for financial\ncalculations, measurements, and any scenario where exact decimal\nrepresentation is required.\n\nThe value is calculated as: m / 10^e, where:\n - m is an unsigned 96-bit integer composed of (lo, mid, hi)\n - e is the scale (0–28) stored in flags bits 16–23\n - sign is encoded in flags bit 31 (0 = positive, 1 = negative)\n\nExamples:\n - 123.45 would have m=12345, e=2\n - -0.001 would have m=1, e=3, with sign bit set\n"
    v1ValueTableTypeColumn:
      type: object
      properties:
        key:
          type: string
          title: The name/key of this column
        value:
          $ref: '#/components/schemas/v1ValueType'
        description:
          type: string
          title: Optional human-readable description of this column
      title: Represents a single column within a table value type
    v1CodeMapping:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/v1CodeMappingEntry'
          description: 'List of mapping entries that associate SPy code regions with English code regions.

            Each entry defines a paired relationship between a span in the SPy code and

            a span in the English code representation.'
      description: 'CodeMapping represents a bidirectional mapping between SPy (Subset-of-Python) code

        and English code locations within an automation. This mapping enables navigation between

        the two representations, facilitating debugging, traceability, and synchronized editing.

        Each entry in the mapping associates a region in the SPy code with its corresponding

        region in the English code. The mapping relationship is many-to-many and entries may

        overlap.'
      required:
      - entries
    v1PhaseSubType:
      type: string
      enum:
      - PHASE_SUB_TYPE_UNSPECIFIED
      - PHASE_SUB_TYPE_EMAIL
      - PHASE_SUB_TYPE_SCHEDULE
      - PHASE_SUB_TYPE_WEBHOOK
      - PHASE_SUB_TYPE_API
      default: PHASE_SUB_TYPE_UNSPECIFIED
      description: "PhaseSubType defines the sub-type within a phase for an automation trigger.\n\n - PHASE_SUB_TYPE_UNSPECIFIED: Unspecified phase sub-type.\n - PHASE_SUB_TYPE_EMAIL: Email trigger sub-type.\n - PHASE_SUB_TYPE_SCHEDULE: Schedule-based trigger sub-type.\n - PHASE_SUB_TYPE_WEBHOOK: Webhook trigger sub-type.\n - PHASE_SUB_TYPE_API: API trigger sub-type."
    v1ListAutomationsResponse:
      type: object
      properties:
        automations:
          type: array
          items:
            $ref: '#/components/schemas/v1Automation'
          description: 'The list of automations for the current page.

            May be empty if no automations match the request criteria.'
        next_page_token:
          type: string
          description: 'A token that can be sent as `page_token` to retrieve the next page.

            If this field is omitted, there are no subsequent pages.'
      description: ListAutomationsResponse returns a page of automations and pagination information.
    v1Set:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1HashableValue'
          title: 'The unique elements stored in this set

            All elements must be hashable types'
      description: "Represents an unordered collection of unique values.\n\nThis message stores a collection of unique elements, where duplicate values\nare automatically removed. Only hashable types can be stored in sets.\nSets are useful for membership testing, removing duplicates, and mathematical\nset operations like union, intersection, and difference.\n\nThe set does not maintain insertion order - elements may appear in any order\nduring iteration.\n\nExamples:\n - {1, 2, 3} - set of numbers\n - {\"apple\", \"banana\", \"cherry\"} - set of strings\n - {true, false} - set of booleans\n - {1, \"hello\", true} - set with mixed hashable types"
    v1DictionaryEntry:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/v1HashableValue'
        value:
          $ref: '#/components/schemas/commonV1Value'
      description: 'Represents a single key-value pair within a Dictionary.


        Both key and value can be any Value type, though keys should be

        hashable types for proper dictionary behavior. Non-hashable keys

        (like lists or dictionaries) may cause runtime errors.'
    v1FlowGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/v1FlowNode'
          description: List of nodes representing steps in the automation flow.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/v1FlowEdge'
          description: List of edges representing connections between nodes.
      description: 'FlowGraph represents the execution flow of an automation as a directed graph.

        The graph consists of nodes (representing steps) and edges (representing transitions).'
    v1MonthPattern:
