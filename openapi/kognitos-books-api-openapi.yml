        preposition:
          type: string
          title: Preposition
        target:
          $ref: '#/components/schemas/v2NounPhrases'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/v2NounPhrases'
          title: Outputs
        proper_nouns:
          type: array
          items:
            type: string
          title: All the proper nouns that appear on this signature
    bdkV2Label:
      type: object
      properties:
        key:
          type: string
          title: The key of the key-value pair
        value:
          type: string
          title: The value of the key-value pair
    v2ConceptDictionaryTypeField:
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/v2ConceptType'
        description:
          type: string
    v2SearchBookMatch:
