openapi: 3.2.0
info:
  title: Kognitos Books API
  version: 1.0.0
  contact:
    name: Kognitos
    url: https://kognitos.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Books across 2 of this provider''s published API definitions: kognitos-openapi.yaml, kognitos-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.us-1.kognitos.com
security:
- BearerAuth: []
tags:
- name: Books
  description: Browse and search books, concepts, procedures, connections, and triggers.
paths:
  /api/v1/books:
    get:
      summary: View Books
      description: 'This endpoint returns metadata for all books that are currently available

        in the runtime, including their names, versions, descriptions, authentication

        requirements, and capabilities.'
      operationId: ListBooks
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2RetrieveBooksResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: page_size
        description: The maximum number of books to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: The token to use to retrieve the next page of books.
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'AIP-160 Filter expression

          https://google.aip.dev/160'
        in: query
        required: false
        schema:
          type: string
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/books/{name}/{version}:
    get:
      summary: View Book Details
      description: 'This endpoint provides comprehensive metadata about a particular book,

        including its description, author, icon, authentication mechanisms,

        configuration parameters, and capabilities.'
      operationId: GetBook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2RetrieveBookResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/books/{name}/{version}/procedures:
    get:
      summary: View Book Procedures
      description: 'This endpoint returns a list of all procedures (functions/operations) that

        can be invoked on the specified book, along with their signatures, input/output

        parameters, and metadata such as descriptions and examples.'
      operationId: ListBookProcedures
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2RetrieveBookProceduresResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/tags:
    get:
      summary: View Tags
      description: 'This endpoint returns a consolidated list of all tags used across all books

        in the library. Tags are used for categorizing and organizing books by

        functionality, domain, or other characteristics.'
      operationId: ListTags
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2RetrieveTagsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      tags:
