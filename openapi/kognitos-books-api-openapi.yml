    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/books/{name}/{version}/concepts:
    get:
      summary: View Book Concepts
      description: 'This endpoint returns a list of concept descriptors defined by the

        specified book, which can be referenced by procedures as inputs or outputs.'
      operationId: ListBookConcepts
      responses:
