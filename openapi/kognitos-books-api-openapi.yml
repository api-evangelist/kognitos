components:
  schemas:
    v2BookAuthenticationDescriptor:
      type: object
      properties:
        custom:
          $ref: '#/components/schemas/v2BookCustomAuthenticationDescriptor'
        oauth:
          $ref: '#/components/schemas/v2BookOAuthAuthenticationDescriptor'
    v2NounPhrase:
      type: object
      properties:
        modifiers:
          type: array
          items:
            type: string
          title: Optional adjectives attached to the noun
        head:
          type: string
          title: Noun of the phrase
    UpdateWorkspaceBookConnectionBody:
      type: object
      properties:
        connection_name:
          type: string
          title: The connection name
        authentication:
          $ref: '#/components/schemas/v2Authentication'
        config_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/bdkV2Value'
          title: Input config
        labels:
          type: array
          items:
            $ref: '#/components/schemas/bdkV2Label'
          title: Labels associated with the connection
        oauth_flow:
          $ref: '#/components/schemas/v2OAuthFlow'
      title: The book connection to update
    v2ConceptSensitiveType:
      type: object
      properties:
        inner:
          $ref: '#/components/schemas/v2ConceptType'
    v2BookPollDescriptor:
      type: object
      properties:
        id:
          type: string
          title: The identifier of the poll
        name:
          type: string
          title: The name of the poll
        description:
          type: string
          title: Description of the poll
        configuration:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v2ConceptDescriptor'
          title: Configuration parameters for the poll
        stop_function_name:
          type: string
          title: Required stop function name
        output_concept:
          $ref: '#/components/schemas/v2ConceptDescriptor'
    v2TriggerInstanceStateCategory:
      type: string
      enum:
      - TRIGGER_INSTANCE_STATE_CATEGORY_WARNING
      - TRIGGER_INSTANCE_STATE_CATEGORY_READY
      - TRIGGER_INSTANCE_STATE_CATEGORY_FAILED
      default: TRIGGER_INSTANCE_STATE_CATEGORY_WARNING
      title: The category/level of the connection state
    v2CredentialValue:
      type: object
      properties:
        id:
          type: string
          title: Id of the credential
        value:
          $ref: '#/components/schemas/bdkV2Value'
    v2BookConnectionOAuthURLResponse:
      type: object
      properties:
        url:
          type: string
          title: 'The URL to kick off the OAuth flow. It contains:

            - The authorize endpoint

            - The state

            - The scope

            - The redirect uri'
    v2RetrieveBookResponse:
      type: object
      properties:
        book:
          $ref: '#/components/schemas/v2BookDescriptor'
    v2OAuthProvider:
      type: string
      enum:
      - OAuthProviderMicrosoft
      - OAuthProviderGoogle
      - OAuthProviderGeneric
      default: OAuthProviderMicrosoft
      title: Supported OAuth providers
    v2BookConnectionResponse:
      type: object
      properties:
        book_connection_descriptor:
          $ref: '#/components/schemas/v2BookConnectionDescriptor'
        authorize_url:
          $ref: '#/components/schemas/v2BookConnectionOAuthURLResponse'
      title: The response to an add/update book connection request
    v2BookConnectionConditionStatus:
      type: string
      enum:
      - BOOK_CONNECTION_CONDITION_STATUS_TRUE
      - BOOK_CONNECTION_CONDITION_STATUS_FALSE
      - BOOK_CONNECTION_CONDITION_STATUS_UNKNOWN
      - BOOK_CONNECTION_CONDITION_STATUS_PENDING
      default: BOOK_CONNECTION_CONDITION_STATUS_TRUE
      description: "Possible Values:\n - True: All good\n - False: An error occurred\n - Unknown: Condition not applicable/relevant\n - Pending: Underlying process (upon which the condition depends) still ongoing"
      title: Status values for conditions
    v2BookCustomAuthenticationDescriptor:
      type: object
      properties:
        id:
          type: string
          description: 'Since books can have multiple authentication mechanisms there is

            and ID to differentiate each mechanism.'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/v2CredentialDescriptor'
          title: Credentials required to perform authentication
        description:
          type: string
          title: A description of the authentication
        name:
          type: string
          title: A name for the authentication
        noun_phrase:
          $ref: '#/components/schemas/v2NounPhrase'
        preferred:
          type: boolean
          title: If this is a preferred authentication method
    AddWorkspaceBookConnectionBody:
      type: object
      properties:
        connection_name:
          type: string
          title: The connection name
        authentication:
          $ref: '#/components/schemas/v2Authentication'
        config_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/bdkV2Value'
          title: Configuration for the connection
        labels:
          type: array
          items:
            $ref: '#/components/schemas/bdkV2Label'
          title: Labels associated with the connection
        oauth_flow:
          $ref: '#/components/schemas/v2OAuthFlow'
      title: The book connection to add
    v2BookConnectionStatus:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/v2BookConnectionState'
        state_category:
          $ref: '#/components/schemas/v2BookConnectionStateCategory'
        reason:
          type: string
          title: Human-readable message providing additional details about the current state
        last_updated:
          type: string
          title: RFC 3339 timestamp of when the status was last updated
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/v2BookConnectionCondition'
          title: List of conditions that apply to the BookConnection
      title: Status information for a BookConnection
    v2BookConnectionConditionType:
      type: string
      enum:
      - BOOK_CONNECTION_CONDITION_TYPE_BOOK_VALID
      - BOOK_CONNECTION_CONDITION_TYPE_AUTHENTICATION_VALID
      - BOOK_CONNECTION_CONDITION_TYPE_CONFIGURATION_VALID
      - BOOK_CONNECTION_CONDITION_TYPE_DEPLOYMENT_READY
      - BOOK_CONNECTION_CONDITION_TYPE_CREDENTIALS_VALID
      - BOOK_CONNECTION_CONDITION_TYPE_DISCOVER_READY
      - BOOK_CONNECTION_CONDITION_TYPE_TRIGGER_INSTANCES_READY
      - BOOK_CONNECTION_CONDITION_TYPE_COMPATIBLE_RUNTIME_VERSION
      default: BOOK_CONNECTION_CONDITION_TYPE_BOOK_VALID
      description: "Represents the various condition types that can be associated with a BookConnection.\n\nConditions are categorized into two groups:\n\n1. [Static Conditions] These conditions are determined solely by the BookConnection's data structure\n   and configuration, and they can be validated without external dependencies or runtime state:\n   - BOOK_VALID\n   - AUTHENTICATION_VALID\n   - CONFIGURATION_VALID\n\n2. [Dynamic Conditions] These conditions depend on external factors and runtime state that can change\n   independently of the BookConnection spec. They require active monitoring and periodic re-evaluation:\n   - DEPLOYMENT_READY\n   - CREDENTIALS_VALID\n   - DISCOVER_READY\n   - TRIGGER_INSTANCES_READY\n   - COMPATIBLE_RUNTIME_VERSION\n\n - BOOK_CONNECTION_CONDITION_TYPE_BOOK_VALID: Static\n - BOOK_CONNECTION_CONDITION_TYPE_DEPLOYMENT_READY: Dynamic"
    v2ConceptDictionaryType:
      type: object
      properties:
        is_a:
          type: array
          items:
            $ref: '#/components/schemas/v2NounPhrase'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/v2ConceptDictionaryTypeField'
        description:
          type: string
    v2BinaryExpression:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/v2BinaryOperator'
        left:
          $ref: '#/components/schemas/v2Expression'
        right:
          $ref: '#/components/schemas/v2Expression'
    v2ConceptValue:
      type: object
      properties:
        noun_phrases:
          $ref: '#/components/schemas/v2NounPhrases'
        value:
          $ref: '#/components/schemas/bdkV2Value'
    v2RemoveWorkspaceBookConnectionTriggerInstanceResponse:
      type: object
    v2ConceptListType:
      type: object
      properties:
        inner:
          $ref: '#/components/schemas/v2ConceptType'
    v2SearchWorkspaceBookProceduresResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/v2SearchWorkspaceBookProcedureMatch'
          title: Ranked list of matches for the given query
      title: Search results for workspace book procedures (static and discovered)
    v2BookConnectionCondition:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/v2BookConnectionConditionType'
        status:
          $ref: '#/components/schemas/v2BookConnectionConditionStatus'
        last_transition_time:
          type: string
          title: RFC 3339 timestamp of when this condition was last updated
        reason:
          type: string
          title: Brief reason explaining the condition
        reason_code:
          $ref: '#/components/schemas/v2BookConnectionConditionReasonCode'
      title: Condition information for BookConnection
    v2ConceptTableTypeColumn:
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/v2ConceptType'
        description:
          type: string
    SearchWorkspaceBookProceduresBody:
      type: object
      properties:
        query:
          type: string
          title: Free-text search query to match against procedure metadata and signatures
        top_k:
          type: integer
          format: int64
          title: Maximum number of results to return
        max_distance:
          type: number
          format: float
          title: Maximum distance threshold for similarity matching
      title: Search for procedures across all available books in a workspace
    v2ConceptSelfType:
      type: object
    v2BookConnectionConditionReasonCode:
      type: string
      enum:
      - BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_LOOKUP_FAILED
      - BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_NOT_FOUND
      - BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_MISSING_IMAGE
      - BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_RUNTIME_VERSION_OUTDATED
      - BOOK_CONNECTION_CONDITION_REASON_CODE_AUTHENTICATION_ID_NOT_FOUND
      - BOOK_CONNECTION_CONDITION_REASON_CODE_MISSING_CREDENTIAL
      - BOOK_CONNECTION_CONDITION_REASON_CODE_WRONG_CREDENTIAL_TYPE
      - BOOK_CONNECTION_CONDITION_REASON_CODE_SECRET_NOT_FOUND
      - BOOK_CONNECTION_CONDITION_REASON_CODE_SECRET_MISSING_KEY
      - BOOK_CONNECTION_CONDITION_REASON_CODE_AUTHENTICATION_REQUIRED_MISSING
      - BOOK_CONNECTION_CONDITION_REASON_CODE_AUTHENTICATION_TEST_FAILED
      - BOOK_CONNECTION_CONDITION_REASON_CODE_TOKEN_REFRESH_FAILED
      - BOOK_CONNECTION_CONDITION_REASON_CODE_CONFIGURATION_UNKNOWN_KEY
      - BOOK_CONNECTION_CONDITION_REASON_CODE_CONFIGURATION_WRONG_TYPE
      - BOOK_CONNECTION_CONDITION_REASON_CODE_REPLICA_COUNT_IS_ZERO
      - BOOK_CONNECTION_CONDITION_REASON_CODE_NEW_DEPLOYMENT_ROLLED_OUT
      - BOOK_CONNECTION_CONDITION_REASON_CODE_DISCOVER_IN_PROGRESS
      - BOOK_CONNECTION_CONDITION_REASON_CODE_DISCOVER_FAILED
      default: BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_LOOKUP_FAILED
      description: "- BOOK_CONNECTION_CONDITION_REASON_CODE_BOOK_LOOKUP_FAILED: Book related\n - BOOK_CONNECTION_CONDITION_REASON_CODE_AUTHENTICATION_ID_NOT_FOUND: Authentication related\n - BOOK_CONNECTION_CONDITION_REASON_CODE_CONFIGURATION_UNKNOWN_KEY: Configuration related\n - BOOK_CONNECTION_CONDITION_REASON_CODE_REPLICA_COUNT_IS_ZERO: Connection related\n - BOOK_CONNECTION_CONDITION_REASON_CODE_DISCOVER_IN_PROGRESS: Discover related"
      title: Machine-readable reason codes for condition transitions
    v2DiscoverWorkspaceBookConnectionProceduresResponse:
      type: object
      title: A response that is sent to reply to a library discovery request
    v2BookTriggerDescriptor:
      type: object
      properties:
        id:
          type: string
          title: The identifier of the trigger
        name:
          type: string
          title: The name of the trigger
        description:
          type: string
          title: Description of the trigger
        setup_description:
          type: string
          title: Setup description for the trigger
        configuration:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v2ConceptDescriptor'
          title: Configuration parameters for the trigger
