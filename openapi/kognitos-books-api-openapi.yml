          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/v2SearchBookProceduresRequest'
        required: true
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/books:search:
    post:
      summary: Search Books
      description: 'This endpoint returns ranked books that best match the provided query.

