                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{name}/{version}/concepts:
    get:
      summary: View Workspace Book Concepts
      description: 'This endpoint returns a list of concept descriptors defined by the

        specified book in the workspace, which can be referenced by procedures as inputs or outputs.'
      operationId: ListWorkspaceBookConcepts
      responses:
