    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books:
    get:
      summary: View Workspace Books
      description: 'This endpoint returns metadata for all books that are currently available

        in the runtime for the specified workspace, including their names, versions,

