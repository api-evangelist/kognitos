        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: The maximum number of books to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: The token to use to retrieve the next page of books.
        in: query
        required: false
        schema:
          type: string
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/books/{name}/{version}/procedures:
    get:
      summary: View Workspace Book Procedures
      description: 'This endpoint returns a list of all procedures (functions/operations) that

        can be invoked on the specified book in the workspace, along with their signatures,

