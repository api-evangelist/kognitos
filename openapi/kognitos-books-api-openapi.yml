        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
      - name: search
        description: A search term to filter the discoverables
        in: query
        required: false
        schema:
          type: string
      - name: offset
        description: 'The starting point within the data set from which records will be returned.

          Used for pagination.'
        in: query
        required: false
        schema:
          type: string
          format: uint64
      - name: limit
        description: 'The maximum number of records to return from the data set.

          Used for pagination.'
        in: query
        required: false
        schema:
          type: string
          format: uint64
      tags:
      - Books
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/procedures:search:
    post:
      summary: Search Book Procedures
      description: 'This endpoint returns ranked procedures that best match the provided query.

        Each result includes the owning book name and version, a full procedure descriptor,

        and a relevance score.'
      operationId: SearchBookProcedures
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v2SearchBookProceduresResponse'
        default:
