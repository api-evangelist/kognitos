        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: page_size
        description: The maximum number of books to return.
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: The token to use to retrieve the next page of books.
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'AIP-160 Filter expression

          https://google.aip.dev/160'
        in: query
        required: false
        schema:
