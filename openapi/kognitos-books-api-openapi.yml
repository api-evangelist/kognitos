          $ref: '#/components/schemas/v2File'
      title: A file value represents a file that can be either inline or remote
    v2ConceptScalarType:
      type: string
      enum:
      - ConceptScalarTypeConceptual
      - ConceptScalarTypeText
      - ConceptScalarTypeNumber
      - ConceptScalarTypeBoolean
      - ConceptScalarTypeDatetime
      - ConceptScalarTypeDate
      - ConceptScalarTypeTime
      - ConceptScalarTypeFile
      - ConceptScalarTypeUUID
      default: ConceptScalarTypeConceptual
      title: Supported concept types
    v2RetrieveBookConnectionResponse:
      type: object
      properties:
        book_connection:
          $ref: '#/components/schemas/v2BookConnectionDescriptor'
    v2TriggerInstanceState:
