        state:
          $ref: '#/components/schemas/v1RunState'
        update_time:
          type: string
          format: date-time
          description: 'The timestamp when this run was updated.

            Set automatically when the run is updated.'
          readOnly: true
        previous_run:
          type: string
          title: 'The name of the previous run in the chain, if applicable.

            Execution details of the previous run may be used to avoid re-computation.

            Format: organizations/{organization}/workspaces/{workspace}/automations/{automation}/runs/{run}'
        stage:
          $ref: '#/components/schemas/v1AutomationStage'
        stage_version:
          type: string
          description: The version of the automation stage at the time this run was created.
        invocation_details:
          $ref: '#/components/schemas/v1InvocationDetails'
        user_inputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: The user inputs provided to the run during pre phase and will be available for the UI to display the user inputs.
      description: 'Run represents a single execution instance of code in the Jeeves platform.

        Contains the executable code, metadata, and current execution state.'
      required:
      - stage
      - stage_version
    v1NodeSkipped:
      type: object
      properties:
        code_location:
          $ref: '#/components/schemas/commonV1Location'
        node_id:
          type: string
          title: The id of the node that was skipped
        node_kind:
          type: string
          title: The kind/type of the node that was skipped
      title: Event emitted when Jarvis skips executing an AST node
    v1ExecutionJournal:
      type: object
      properties:
        execution_id:
          type: string
          title: Unique identifier for the execution
        run_id:
          type: string
          title: 'Optional: Run identifier, set if the execution is part of a run'
        event_time:
          type: string
          format: date-time
          title: When this journal entry was generated
        started:
          $ref: '#/components/schemas/v1ExecutionStarted'
        completed:
          $ref: '#/components/schemas/v1ExecutionCompleted'
        stopped:
          $ref: '#/components/schemas/v1ExecutionStopped'
        failed:
          $ref: '#/components/schemas/v1ExecutionFailed'
        node_started:
          $ref: '#/components/schemas/v1NodeStarted'
        node_executed:
          $ref: '#/components/schemas/v1NodeExecuted'
        node_skipped:
          $ref: '#/components/schemas/v1NodeSkipped'
        node_patched:
          $ref: '#/components/schemas/v1NodePatched'
        patched_node_started:
          $ref: '#/components/schemas/v1PatchedNodeStarted'
        patched_node_executed:
          $ref: '#/components/schemas/v1PatchedNodeExecuted'
        automation_id:
          type: string
          title: 'Optional: Automation identifier, set if the execution is part of an automation'
        automation_phase_id:
          type: string
          title: 'Optional: Automation phase identifier, set if the execution is part of an automation phase'
        code_hash:
          type: string
          title: 'Optional: MD5 hash of the SPy code being executed'
        stage:
          $ref: '#/components/schemas/v1AutomationStage'
        workspace_id:
          type: string
          title: The workspace id for which the execution is requested
        organization_id:
          type: string
          title: The organization id for which the execution is requested
        extra_metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: 'Optional extra metadata to be stored with the execution

            This will be used to pass the additional information that downstream services might require

            but there is no need to Jarvis to know about it.'
      title: Journal event for an execution, capturing status and node-level events
    v1WaitingOnTimer:
      type: object
      properties:
        duration:
          type: string
          description: The duration of the timer.
      description: 'WaitingOnTimer indicates that the execution is stopped because its

        waiting for a timer to fire. The run manager is expected to resume the

        execution when the timer fires.'
    v1Dictionary:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/v1DictionaryEntry'
          title: The key-value pairs stored in this dictionary
      description: "Represents a key-value mapping (similar to hash maps or dictionaries).\n\nThis message stores associations between keys and values, where keys must be\nhashable types (null, bool, Number, string, Date, TimeOfDay, DateTime, TimeZone). Keys are\nunique within a dictionary - duplicate keys will overwrite previous values.\n\nThe dictionary maintains insertion order for consistent iteration behavior.\n\nExamples:\n - {\"name\": \"John\", \"age\": 30} - string keys with mixed values\n - {1: \"one\", 2: \"two\"} - number keys with string values\n - {\"nested\": {\"inner\": \"value\"}} - nested dictionaries"
    v1AutomationPhaseType:
      type: string
      enum:
      - AUTOMATION_PHASE_TYPE_UNSPECIFIED
      - AUTOMATION_PHASE_TYPE_PRE
      - AUTOMATION_PHASE_TYPE_MAIN
      - AUTOMATION_PHASE_TYPE_POST
      default: AUTOMATION_PHASE_TYPE_UNSPECIFIED
      description: "PhaseType defines the type of phase for an automation trigger.\n\n - AUTOMATION_PHASE_TYPE_UNSPECIFIED: Unspecified phase type.\n - AUTOMATION_PHASE_TYPE_PRE: Pre-processing phase.\n - AUTOMATION_PHASE_TYPE_MAIN: Main processing phase.\n - AUTOMATION_PHASE_TYPE_POST: Post-processing phase."
    v1WaitingOnBook:
      type: object
      description: 'WaitingOnBook indicates that the execution is stopped because its

        waiting on an async book procedure to complete. The run manager is expected

        to resume the execution when the book procedure completes.'
    v1Number:
      type: object
      properties:
        lo:
          type: integer
          format: int64
          description: Low 32 bits of the 96-bit mantissa.
        mid:
          type: integer
          format: int64
          description: Middle 32 bits of the 96-bit mantissa.
        hi:
          type: integer
          format: int64
          description: High 32 bits of the 96-bit mantissa.
        flags:
          type: integer
          format: int64
          description: "Flags word:\n - Bits 16–23: scale (0–28)\n - Bit 31: sign (0 = positive, 1 = negative)\n - Other bits must be zero."
      description: "A fixed-precision decimal number with up to 28 fractional digits.\n\nThis message represents decimal numbers with exact precision, avoiding\nfloating-point rounding errors. It's particularly useful for financial\ncalculations, measurements, and any scenario where exact decimal\nrepresentation is required.\n\nThe value is calculated as: m / 10^e, where:\n - m is an unsigned 96-bit integer composed of (lo, mid, hi)\n - e is the scale (0–28) stored in flags bits 16–23\n - sign is encoded in flags bit 31 (0 = positive, 1 = negative)\n\nExamples:\n - 123.45 would have m=12345, e=2\n - -0.001 would have m=1, e=3, with sign bit set\n"
    v1ExecutionStopped:
      type: object
      properties:
        user_stopped:
          $ref: '#/components/schemas/v1UserStopped'
        waiting_on_book:
          $ref: '#/components/schemas/v1WaitingOnBook'
        waiting_on_timer:
          $ref: '#/components/schemas/v1WaitingOnTimer'
        program_stopped:
          $ref: '#/components/schemas/v1ProgramStopped'
      description: 'ExecutionStopped indicates that the execution was stopped before completion due to

        a specific reason.'
    v1ValueTableTypeColumn:
      type: object
      properties:
        key:
          type: string
          title: The name/key of this column
        value:
          $ref: '#/components/schemas/v1ValueType'
        description:
          type: string
          title: Optional human-readable description of this column
      title: Represents a single column within a table value type
    v1Set:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/v1HashableValue'
          title: 'The unique elements stored in this set

            All elements must be hashable types'
      description: "Represents an unordered collection of unique values.\n\nThis message stores a collection of unique elements, where duplicate values\nare automatically removed. Only hashable types can be stored in sets.\nSets are useful for membership testing, removing duplicates, and mathematical\nset operations like union, intersection, and difference.\n\nThe set does not maintain insertion order - elements may appear in any order\nduring iteration.\n\nExamples:\n - {1, 2, 3} - set of numbers\n - {\"apple\", \"banana\", \"cherry\"} - set of strings\n - {true, false} - set of booleans\n - {1, \"hello\", true} - set with mixed hashable types"
    v1DictionaryEntry:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/v1HashableValue'
        value:
          $ref: '#/components/schemas/commonV1Value'
      description: 'Represents a single key-value pair within a Dictionary.


        Both key and value can be any Value type, though keys should be

        hashable types for proper dictionary behavior. Non-hashable keys

        (like lists or dictionaries) may cause runtime errors.'
    v1ExecutingRunState:
      type: object
      description: 'Run is currently being executed.

        Code is actively running and making progress.'
    commonV1Location:
      type: object
      properties:
        start_byte:
          type: string
          format: int64
          title: Starting Byte of the span, It will be zero-based
        end_byte:
          type: string
          format: int64
          title: Ending Byte(exclusive) of the span, It will be zero-based
      description: 'Location represents a generic span within some underlying content.

        It specifies the starting byte offset and the ending byte offset (exclusive) of the span.

        This can be used for pointing to regions in files, buffers, logs, messages,

        or any other byte-addressable resource.'
    v1RunState:
      type: object
      properties:
        pending:
          $ref: '#/components/schemas/v1PendingRunState'
        executing:
          $ref: '#/components/schemas/v1ExecutingRunState'
        stopping:
          $ref: '#/components/schemas/v1StoppingRunState'
        stopped:
          $ref: '#/components/schemas/v1StoppedRunState'
        awaiting_guidance:
