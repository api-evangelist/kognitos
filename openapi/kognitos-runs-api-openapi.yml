openapi: 3.2.0
info:
  title: Kognitos Runs API
  version: 1.0.0
  contact:
    name: Kognitos
    url: https://kognitos.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged Runs across 2 of this provider''s published API definitions: kognitos-openapi.yaml, kognitos-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://app.us-1.kognitos.com
security:
- BearerAuth: []
tags:
- name: Runs
  description: Execute automations and manage run lifecycle — start, pause, continue, and view events.
paths:
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}:
    get:
      summary: Get Run
      operationId: GetRun
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Run'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs:
    get:
      summary: List Runs
      operationId: ListRuns
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListRunsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: 'The maximum number of runs to return in a single response.

          The service may return fewer than this value.

          If unspecified or 0, at most 10 runs will be returned.

          The maximum value is 1000; values above 1000 will be coerced to 1000.

          If negative, an INVALID_ARGUMENT error will be returned.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'A page token received from a previous `ListRuns` call.

          Provide this to retrieve the subsequent page of results.

          When paginating, all other parameters provided to `ListRuns` must match

          the call that provided the page token.'
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: "Filter expression for filtering runs.\nFollows the structured syntax defined in AIP-160.\n\nSupported fields for filtering:\n- create_time: The timestamp when the run was created (google.protobuf.Timestamp)\n\nSupported operators:\n- Comparison: =, !=, <, >, <=, >=\n- Logical: AND, OR, NOT, -\n\nExamples:\n- Filter runs created after a specific date (start_date):\n  \"create_time >= \\\"2024-01-01T00:00:00Z\\\"\"\n- Filter runs created before a specific date (end_date):\n  \"create_time <= \\\"2024-12-31T23:59:59Z\\\"\"\n- Filter runs within a date range (start_date and end_date):\n  \"create_time >= \\\"2024-01-01T00:00:00Z\\\" AND create_time <= \\\"2024-12-31T23:59:59Z\\\"\"\n- Complex filter with multiple date ranges:\n  \"(create_time >= \\\"2024-01-01T00:00:00Z\\\" AND create_time <= \\\"2024-06-30T23:59:59Z\\\") OR create_time >= \\\"2024-07-01T00:00:00Z\\\"\"\n\nTimestamps must be in RFC-3339 format (e.g., \"2024-01-01T00:00:00Z\").\nIf an invalid filter expression is provided, the API will return INVALID_ARGUMENT."
        in: query
        required: false
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}:pause:
    post:
      summary: Pause Run
      operationId: PauseRun
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Run'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseRunBody'
        required: true
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}:continue:
    post:
      summary: Continue Run
      operationId: ContinueRun
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1Run'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueRunBody'
        required: true
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}:automationRunAggregates:
    get:
      summary: Query Automation Run Aggregates
      operationId: QueryAutomationRunAggregates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1QueryAutomationRunAggregatesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}:dailyRunAggregates:
    get:
      summary: Query Daily Run Aggregates
      operationId: QueryDailyRunAggregates
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1QueryDailyRunAggregatesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: start_date.year
        description: 'Year of the date. Must be from 1 to 9999, or 0 to specify a date without

          a year.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: start_date.month
        description: 'Month of a year. Must be from 1 to 12, or 0 to specify a year without a

          month and day.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: start_date.day
        description: 'Day of a month. Must be from 1 to 31 and valid for the year and month, or 0

          to specify a year by itself or a year and month where the day isn''t

          significant.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: end_date.year
        description: 'Year of the date. Must be from 1 to 9999, or 0 to specify a date without

          a year.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: end_date.month
        description: 'Month of a year. Must be from 1 to 12, or 0 to specify a year without a

          month and day.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: end_date.day
        description: 'Day of a month. Must be from 1 to 31 and valid for the year and month, or 0

          to specify a year by itself or a year and month where the day isn''t

          significant.'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: time_zone
        description: 'Time zone for date aggregation.

          Format: IANA timezone identifier (e.g., "America/New_York", "UTC", "Europe/London")'
        in: query
        required: true
        schema:
          type: string
      - name: filter
        description: "Filter expression for filtering runs included in the aggregation.\nFollows the structured syntax defined in AIP-160.\n\nSupported fields for filtering:\n- automation_id: The unique identifier of the automation (string)\n\nSupported operators:\n- Comparison: =\n- Logical: OR\n\nExamples:\n- Filter by specific automation:\n  \"automation_id = \\\"789\\\"\"\n- Filter by multiple automations:\n  \"automation_id = \\\"789\\\" OR automation_id = \\\"790\\\"\"\n\nIf an invalid filter expression is provided, the API will return INVALID_ARGUMENT."
        in: query
        required: false
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/executions/{execution_id}/outputs:
    get:
      summary: Get Execution Outputs
      operationId: GetExecutionOutputs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1GetExecutionOutputsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
  /api/v1/organizations/{organization_id}/workspaces/{workspace_id}/automations/{automation_id}/runs/{run_id}/events:
    get:
      summary: List Run Events
      description: 'This RPC retrieves a paginated list of all events that occurred during

        a specific automation run. Events are returned in the order they were

        generated, providing a complete timeline of the run''s execution.


        Use the filter parameter to narrow results by specific criteria such as

        node_kind for execution journal events.


        The response includes both high-level run state changes (starts, completions,

        failures) and detailed execution steps (node executions, execution patches,

        detailed data flows in each expression, etc).'
      operationId: ListRunEvents
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/v1ListRunEventsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
      - name: automation_id
        in: path
        required: true
        schema:
          type: string
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: page_size
        description: 'Maximum number of run events to return in a single response.


          The service may return fewer events than requested, but will never

          return more. This can happen when:

          - The run has fewer total events than requested

          - Internal chunking limits are reached

          - The remaining events don''t fit in the response size limit


          Valid range: 1-1000 events

          Default: 100 events if unspecified

          Values above 1000 are automatically capped at 1000

          Negative values result in an INVALID_ARGUMENT error'
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page_token
        description: 'Pagination token from a previous ListRunEvents response.


          Provide the `next_page_token` value from a previous response to

          continue retrieving the next set of events. Leave empty or unset

          for the first page of results.


          The token is opaque and should not be parsed or modified by clients.'
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: "Filter expression to narrow down which events are returned.\n\nThe filter string follows the AIP-160 filtering syntax\n(https://google.aip.dev/160).\n\nSupported fields for filtering:\n- node_kind: Filter execution journal events by the kind/type of node.\n  Only execution journal events with matching node_kind are returned.\n  Example: node_kind = \"FunctionCall\"\n\nWhen empty or unset, all events for the specified run are returned.\n\nExample filters:\n  node_kind = \"FunctionCall\"\n  node_kind = \"Assignment\""
        in: query
        required: false
        schema:
          type: string
      tags:
      - Runs
    servers:
    - url: https://app.us-1.kognitos.com
components:
  schemas:
    v1GetExecutionOutputsResponse:
      type: object
      properties:
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v1ExecutionOutput'
          description: 'Map of named output values set by the set_output() builtin function during execution.

            The key is the output name (string) and the value is the ExecutionOutput containing

            the value and type set by calling set_output(name, value).

            This map will be empty if no set_output() calls were made during execution.'
      description: GetExecutionOutputsResponse contains the outputs from a completed execution.
    v1AutomationRunAggregate:
      type: object
      properties:
        total_runs:
          type: string
          format: int64
          description: The total number of runs for this automation.
          readOnly: true
        completed_runs:
          type: string
          format: int64
          description: The number of completed runs for this automation.
          readOnly: true
      description: 'Stats for a single automation.

        Contains run counts and other metrics.'
    v1AutomationStage:
      type: string
      enum:
      - AUTOMATION_STAGE_UNSPECIFIED
      - AUTOMATION_STAGE_DRAFT
      - AUTOMATION_STAGE_PUBLISHED
      default: AUTOMATION_STAGE_UNSPECIFIED
      description: "AutomationStage represents the publication stage of an automation.\nThis enum is shared across services that manage or execute automations.\n\n - AUTOMATION_STAGE_UNSPECIFIED: Automation stage is not specified.\n - AUTOMATION_STAGE_DRAFT: Automation is in draft stage and can be modified.\n - AUTOMATION_STAGE_PUBLISHED: Automation is published and immutable, ready for execution."
    v1NodeExecuted:
      type: object
      properties:
        code_location:
          $ref: '#/components/schemas/commonV1Location'
        inputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: 'The input variables & their values

            A variable is defined as an input if it was fetched

            from the memory while executing the node or one of its

            children.'
        outputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: 'The output variables & their values

            A variable is defined as an output if it was written to

            the memory while executing the node or one of its

            children.

            If a variable was written multiple times, only the last

            written value is considered as the output.'
        error:
          type: array
          items:
            $ref: '#/components/schemas/v1ExecutionError'
          description: 'The list of all the errors that occurred while executing the

            node or any of its children.'
        node_id:
          type: string
          title: The id of the node that got executed
        book_function_call:
          $ref: '#/components/schemas/v1BookFunctionCall'
        node_kind:
          type: string
          title: The kind/type of the node that was executed
      title: Event emitted after Jarvis finishes executing an AST node, with I/O and errors
    v1NodeStarted:
      type: object
      properties:
        code_location:
          $ref: '#/components/schemas/commonV1Location'
        node_id:
          type: string
          title: The id of the node that was started
        node_kind:
          type: string
          title: The kind/type of the node that was started
      title: Event emitted when Jarvis begins executing an AST node
    v1Table:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/v1Column'
      description: 'A table is a column-oriented structure. All the values inside each column must

        be of equal length.'
    v1BookConnection:
      type: object
      properties:
        connection_id:
          type: string
          description: Unique identifier for this connection resource.
        endpoint:
          type: string
          description: Endpoint for the connection.
      description: 'BookConnection is a resource representing a connection to a book instance.

        A connection has a unique identifier and an endpoint.'
    v1RunEvent:
      type: object
      properties:
        run_update:
          $ref: '#/components/schemas/v1RunUpdate'
        execution_journal:
          $ref: '#/components/schemas/v1ExecutionJournal'
      description: A single event that occurred during an automation run execution.
    v1List:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/commonV1Value'
          title: The ordered sequence of values in this list
      description: "Represents an ordered collection of values (similar to arrays or lists).\n\nThis message can contain any number of Value elements in a specific order.\nLists are mutable and can grow or shrink during runtime. Elements can be\naccessed by their zero-based index position.\n\nExamples:\n - [1, 2, 3] - list of numbers\n - [\"hello\", \"world\"] - list of strings\n - [true, 42, \"mixed\"] - list with mixed types\n - [[1, 2], [3, 4]] - nested lists"
    bdkV1ListValue:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/bdkV1Value'
          title: All the values inside the list
      title: A collection of values
    v1ExecutableSteps:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/commonV1Value'
          description: 'Input parameters for the execution, provided as name-value pairs.

            These variables will be available to the code during execution.'
        executables:
          type: array
          items:
            $ref: '#/components/schemas/v1ExecutableStep'
          description: The source code to be executed, written in SPy (Simplified Python) language.
      description: 'ExecutableSteps represents a sequence of steps of execution of a run. Each step is

        a separate computable unit with its own code, book connections and optional inputs.

        The first step may optionally have an input provided to it when the run is invoked.

        The output of each step becomes the input of the next step and the output of the

        last step becomes the output of the run.'
      required:
      - executables
    v1ExecutableStep:
      type: object
      properties:
        code:
          type: string
          description: 'The source code to be executed, written in SPy (Simplified Python) language.

            This is the main logic that will be interpreted and run by the execution engine.'
        book_connections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/v1BookConnection'
          description: 'Book connections required by this executable.

            Maps connection names to their specific ID and endpoints.'
        phase_type:
          $ref: '#/components/schemas/v1AutomationPhaseType'
      description: 'ExecutableStep represents a piece of code that can be executed in the Jeeves platform.

        Contains the source code, input parameters, and external dependencies needed for execution.'
      required:
      - code
      - phase_type
    v1ValueType:
      type: object
      properties:
        scalar_type:
          $ref: '#/components/schemas/v1ValueScalarType'
        optional_type:
          $ref: '#/components/schemas/v1ValueOptionalType'
        list_type:
          $ref: '#/components/schemas/v1ValueListType'
        dictionary_type:
          $ref: '#/components/schemas/v1ValueDictionaryType'
        table_type:
          $ref: '#/components/schemas/v1ValueTableType'
        opaque_type:
          $ref: '#/components/schemas/v1ValueOpaqueType'
        any_type:
          $ref: '#/components/schemas/v1ValueAnyType'
        union_type:
          $ref: '#/components/schemas/v1ValueUnionType'
        sensitive_type:
          $ref: '#/components/schemas/v1ValueSensitiveType'
        enum_type:
          $ref: '#/components/schemas/v1ValueEnumType'
        generic_dictionary_type:
          $ref: '#/components/schemas/v1ValueGenericDictionaryType'
      title: Represents a complete value type definition using a discriminated union
    typeDateTime:
      type: object
      properties:
        year:
          type: integer
          format: int32
          description: 'Optional. Year of date. Must be from 1 to 9999, or 0 if specifying a

            datetime without a year.'
        month:
          type: integer
          format: int32
          description: Required. Month of year. Must be from 1 to 12.
        day:
          type: integer
          format: int32
          description: 'Required. Day of month. Must be from 1 to 31 and valid for the year and

            month.'
        hours:
          type: integer
          format: int32
          description: 'Required. Hours of day in 24 hour format. Should be from 0 to 23. An API

            may choose to allow the value "24:00:00" for scenarios like business

            closing time.'
        minutes:
          type: integer
          format: int32
          description: Required. Minutes of hour of day. Must be from 0 to 59.
        seconds:
          type: integer
          format: int32
          description: 'Required. Seconds of minutes of the time. Must normally be from 0 to 59. An

            API may allow the value 60 if it allows leap-seconds.'
        nanos:
          type: integer
          format: int32
          description: 'Required. Fractions of seconds in nanoseconds. Must be from 0 to

            999,999,999.'
        utc_offset:
          type: string
          description: 'UTC offset. Must be whole seconds, between -18 hours and +18 hours.

            For example, a UTC offset of -4:00 would be represented as

            { seconds: -14400 }.'
        time_zone:
          $ref: '#/components/schemas/typeTimeZone'
      description: "Represents civil time (or occasionally physical time).\n\nThis type can represent a civil time in one of a few possible ways:\n\n * When utc_offset is set and time_zone is unset: a civil time on a calendar\n   day with a particular offset from UTC.\n * When time_zone is set and utc_offset is unset: a civil time on a calendar\n   day in a particular time zone.\n * When neither time_zone nor utc_offset is set: a civil time on a calendar\n   day in local time.\n\nThe date is relative to the Proleptic Gregorian Calendar.\n\nIf year is 0, the DateTime is considered not to have a specific year. month\nand day must have valid, non-zero values.\n\nThis type may also be used to represent a physical time if all the date and\ntime fields are set and either case of the `time_offset` oneof is set.\nConsider using `Timestamp` message for physical time instead. If your use\ncase also would like to store the user's timezone, that can be done in\nanother field.\n\nThis type is more flexible than some applications may want. Make sure to\ndocument and validate your application's limitations."
    v1PatchedNodeStarted:
      type: object
      properties:
        patch_location:
          $ref: '#/components/schemas/commonV1Location'
        node_location:
          $ref: '#/components/schemas/commonV1Location'
        node_id:
          type: string
          title: The id of the patched node for which execution is starting
        node_kind:
          type: string
          title: The kind/type of the patched node that is being started
      title: Event emitted when Jarvis starts executing a node inside a patch
    typeTimeOfDay:
      type: object
      properties:
        hours:
          type: integer
          format: int32
          description: 'Hours of day in 24 hour format. Should be from 0 to 23. An API may choose

            to allow the value "24:00:00" for scenarios like business closing time.'
        minutes:
          type: integer
          format: int32
          description: Minutes of hour of day. Must be from 0 to 59.
        seconds:
          type: integer
          format: int32
          description: 'Seconds of minutes of the time. Must normally be from 0 to 59. An API may

            allow the value 60 if it allows leap-seconds.'
        nanos:
          type: integer
          format: int32
          description: Fractions of seconds in nanoseconds. Must be from 0 to 999,999,999.
      description: 'Represents a time of day. The date and time zone are either not significant

        or are specified elsewhere. An API may choose to allow leap seconds. Related

        types are [google.type.Date][google.type.Date] and

