aid: kognitos

name: Kognitos

description: Kognitos is a neurosymbolic agentic AI platform that automates finance, accounts payable, healthcare, and IT workflows in plain English
  ("English as code"), positioned as deterministic agentic AI for the enterprise with zero hallucinations and full audit compliance. The platform
  runs on AWS, offers integrations with SAP, Oracle Cloud ERP, Microsoft Dynamics 365 and Workday, and exposes a REST API (base https://app.us-1.kognitos.com/api/v1,
  Bearer personal access tokens) for managing organizations, workspaces, automations, runs, books, files, exceptions and analytics.

